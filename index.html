<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>পার্সেল- রিপোর্ট</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F1; --card:#FFFFFF; --ink:#16232B; --mute:#5E6E75; --line:#D5DDDB;
  --ok:#0E7F63; --ret:#C23A52; --pen:#C98A12; --accent:#16232B;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F1A1F; --card:#17252C; --ink:#E8EFEE; --mute:#93A5AB; --line:#27383F;
    --ok:#3CC39F; --ret:#F0708A; --pen:#E8B33F; --accent:#E8EFEE; }
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{font-family:'Hind Siliguri','Noto Sans Bengali','Kalpurush','Nikosh','SolaimanLipi','Shonar Bangla','Vrinda','Nirmala UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100%;line-height:1.6;
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.5rem;font-weight:700}
.sub{color:var(--mute);font-size:.95rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:22px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:8px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);width:100%;padding:11px;font-weight:600}
#login{max-width:360px;margin:12vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:26px}
#login h1{margin-bottom:4px}
input{font:inherit;width:100%;padding:10px 12px;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
#err{color:var(--ret);font-size:.9rem;min-height:1.3em;margin-bottom:8px}
.hero{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px}
.hero .big{font-size:3.4rem;font-weight:700;line-height:1.1}
.hero .lbl{color:var(--mute)}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:18px 0 10px;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:.95rem}
.legend b{font-weight:600}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:12px 0 24px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .n{font-size:1.6rem;font-weight:700}
.stat .t{color:var(--mute);font-size:.9rem}
h2{font-size:1.1rem;margin:6px 0 10px}
.chart{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 14px 12px;display:flex;align-items:flex-end;gap:10px;height:230px;margin-bottom:24px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
.stack{width:100%;max-width:56px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden}
.stack i{display:block;width:100%}
.col .tot{font-size:.85rem;font-weight:600;margin-bottom:3px}
.col .m{font-size:.8rem;color:var(--mute);margin-top:6px;white-space:nowrap}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:480px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.95rem}
th{color:var(--mute);font-weight:500}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;padding:1px 10px;border-radius:99px;font-size:.85rem;font-weight:500;border:1px solid currentColor}
.empty{padding:28px;text-align:center;color:var(--mute)}
</style>
</head>
<body>

<div id="app" class="wrap">
  <div class="top">
    <div>
      <h1>পার্সেল রিপোর্ট</h1>
      <p class="sub" id="upd">লোড হচ্ছে…</p>
    </div>
  </div>

  <div class="hero" id="sec-hero">
    <div class="lbl">মোট পাঠানো পার্সেল</div>
    <div class="big" id="total">0</div>
    <div class="bar" id="bar"></div>
    <div class="legend">
      <span><span class="dot" style="background:var(--ok)"></span>ডেলিভারি <b id="lDel">0</b></span>
      <span><span class="dot" style="background:var(--ret)"></span>রিটার্ন <b id="lRet">0</b></span>
      <span><span class="dot" style="background:var(--pen)"></span>পথে/অপেক্ষায় <b id="lPen">0</b></span>
    </div>
  </div>

  <div class="stats" id="sec-stats">
    <div class="stat"><div class="n" id="profit">৳0</div><div class="t">নিট লাভ</div></div>
    <div class="stat"><div class="n" id="rate">0%</div><div class="t">সফল ডেলিভারির হার</div></div>
    <div class="stat"><div class="n" id="cod">৳0</div><div class="t">ডেলিভারি হওয়া পার্সেলের COD</div></div>
    <div class="stat"><div class="n" id="mon">0</div><div class="t">এই মাসে পাঠানো</div></div>
  </div>

  <div id="sec-chart"><h2>মাসভিত্তিক পার্সেল (শেষ ৬ মাস)</h2>
  <div class="chart" id="chart" role="img" aria-label="মাসভিত্তিক পার্সেলের চার্ট"></div></div>

  <div id="sec-recent"><h2>সাম্প্রতিক পার্সেল</h2>
  <div class="tbl"><table>
    <thead><tr><th>ইনভয়েস</th><th>তারিখ</th><th>COD</th><th>অবস্থা</th></tr></thead>
    <tbody id="rows"></tbody>
  </table></div></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
// ===== ইনভেস্টর কোন কোন অংশ দেখবে: true = দেখাবে, false = লুকাবে =====
const SHOW = {
  hero:   true,   // মোট পাঠানো পার্সেল + ডেলিভারি/রিটার্ন/পথে
  stats:  true,   // সফল ডেলিভারির হার, COD, এই মাসের পার্সেল
  chart:  true,   // মাসভিত্তিক চার্ট
  recent: true    // সাম্প্রতিক পার্সেলের তালিকা
};
Object.keys(SHOW).forEach(function(k){ var el=document.getElementById('sec-'+k); if(el && !SHOW[k]) el.style.display='none'; });

const firebaseConfig = {
  apiKey: "AIzaSyDGYdr2HtWokAAM7SU1CYJ_w44XN4n3hEE",
  authDomain: "video-share-8c959.firebaseapp.com",
  projectId: "video-share-8c959",
  appId: "1:752929758077:web:177ca6d2605d62ae3b8a14"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const $ = id => document.getElementById(id);
const bn = n => Number(n).toLocaleString('en-US');
const MONTHS = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টে','অক্টো','নভে','ডিসে'];
let unsub = null;
const money = n => (n < 0 ? '-' : '') + '৳' + bn(Math.abs(n));

function group(s){
  s = String(s||'').toLowerCase();
  if (s.indexOf('cancel') > -1 || s.indexOf('return') > -1) return 'ret';
  if (s.indexOf('deliver') > -1) return 'del';
  return 'pen';
}
function toDate(v){
  if (!v) return null;
  if (v.toDate) return v.toDate();
  const d = new Date(v); return isNaN(d) ? null : d;
}
const LBL = {del:['ডেলিভারি হয়েছে','var(--ok)'], ret:['রিটার্ন','var(--ret)'], pen:['পথে/অপেক্ষায়','var(--pen)']};

function render(docs){
  const c = {del:0, ret:0, pen:0}; let cod = 0, profit = 0;
  const now = new Date(), mk = d => d.getFullYear()*12 + d.getMonth();
  const months = []; for (let i = 5; i >= 0; i--){ const d = new Date(now.getFullYear(), now.getMonth()-i, 1); months.push({k:mk(d), l:MONTHS[d.getMonth()], del:0, ret:0, pen:0}); }
  docs.forEach(p => {
    const g = group(p.status); c[g]++;
    if (g === 'del') { cod += Number(p.cod_amount || p.cod || 0); profit += Number(p.profit || 0); }
    else if (g === 'ret' && Number(p.profit || 0) < 0) profit += Number(p.profit);
    const d = toDate(p.createdAt || p.created_at);
    if (d){ const m = months.find(x => x.k === mk(d)); if (m) m[g]++; }
  });
  const total = c.del + c.ret + c.pen;
  $('total').textContent = bn(total);
  $('lDel').textContent = bn(c.del); $('lRet').textContent = bn(c.ret); $('lPen').textContent = bn(c.pen);
  $('bar').innerHTML = total ? ['del','ret','pen'].map(g => `<i style="width:${c[g]/total*100}%;background:${LBL[g][1]}"></i>`).join('') : '';
  const fin = c.del + c.ret;
  $('rate').textContent = bn(fin ? Math.round(c.del/fin*100) : 0) + '%';
  $('cod').textContent = '৳' + bn(cod);
  $('profit').textContent = money(profit);
  $('mon').textContent = bn(months[5].del + months[5].ret + months[5].pen);

  const max = Math.max(1, ...months.map(m => m.del+m.ret+m.pen));
  $('chart').innerHTML = months.map(m => {
    const t = m.del+m.ret+m.pen, h = t/max*150;
    const seg = g => m[g] ? `<i style="height:${t ? m[g]/t*h : 0}px;background:${LBL[g][1]}"></i>` : '';
    return `<div class="col"><div class="tot">${bn(t)}</div><div class="stack">${seg('del')}${seg('ret')}${seg('pen')}</div><div class="m">${m.l}</div></div>`;
  }).join('');

  const recent = docs.slice(0, 20);
  $('rows').innerHTML = recent.length ? recent.map(p => {
    const g = group(p.status), d = toDate(p.createdAt || p.created_at);
    return `<tr><td>${String(p.invoice || p.consignment_id || '-').replace(/[<>&]/g,'')}</td>
      <td>${d ? d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : '-'}</td>
      <td>৳${bn(p.cod_amount || p.cod || 0)}</td>
      <td><span class="tag" style="color:${LBL[g][1]}">${LBL[g][0]}</span></td></tr>`;
  }).join('') : '<tr><td colspan="4" class="empty">এখনো কোনো পার্সেল নেই</td></tr>';
  $('upd').textContent = 'সর্বশেষ আপডেট: ' + new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function start(){
  unsub = db.collection('publicStats').doc('s_62d283c9620960e6a596').onSnapshot(
    snap => {
      const d = snap.exists ? snap.data() : {};
      const list = (d.orders || []).map(o => ({invoice:o.id, status:o.s, cod_amount:o.cod, profit:o.p, createdAt:o.d}))
        .sort((a,b) => (toDate(b.createdAt)||0) - (toDate(a.createdAt)||0));
      render(list);
      const u = toDate(d.updatedAt);
      if (u) $('upd').textContent = 'সর্বশেষ সিঙ্ক: ' + u.toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
    },
    e => { $('upd').textContent = 'ডাটা লোড হয়নি। লিংকটি ঠিক আছে কিনা দেখুন।'; }
  );
}

start();
</script>
</body>
</html>
